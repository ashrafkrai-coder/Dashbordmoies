<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Kehadiran Murid</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d91">
<link rel="icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
  :root{
    --biru:#0b3d91;
    --biru-gelap:#0a2e70;
    --biru-cerah:#1e5ba8;
    --hijau:#27ae60;
    --merah:#e74c3c;
    --kuning:#f39c12;
    --ungu:#9b59b6;
    --bg:#f0f3f8;
    --bg-card:#ffffff;
    --shadow-sm:0 2px 8px rgba(0,0,0,0.08);
    --shadow-md:0 4px 12px rgba(0,0,0,0.12);
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    height:100%;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    color:#222;
    min-height:100vh;
  }

  /* Header */
  header{
    background:linear-gradient(135deg,var(--biru) 0%,var(--biru-gelap) 100%);
    color:#fff;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    box-shadow:var(--shadow-md);
    border-bottom:3px solid rgba(255,255,255,0.1);
  }

  header h1{
    font-size:20px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .header-controls{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  header input[type="date"]{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    padding:8px 10px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    transition:all 0.2s ease;
  }

  header input[type="date"]:hover{
    background:rgba(255,255,255,0.25);
  }

  header input[type="date"]:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(255,255,255,0.2);
  }

  header input[type="date"]::placeholder{
    color:rgba(255,255,255,0.7);
  }

  header button{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:all 0.2s ease;
    display:flex;
    align-items:center;
    gap:4px;
  }

  header button:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-1px);
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }

  header button:active{
    transform:translateY(0);
  }

  header button:disabled{
    opacity:0.5;
    cursor:default;
  }

  /* Main */
  main{
    padding:16px;
    max-width:1200px;
    margin:auto;
    display:grid;
    gap:16px;
    padding-bottom:40px;
  }

  /* Alert */
  #ralat{
    display:none;
    background:linear-gradient(135deg,#e74c3c 0%,#c0392b 100%);
    color:#fff;
    padding:12px 16px;
    border-radius:8px;
    box-shadow:var(--shadow-md);
    border-left:4px solid #fff;
    font-weight:600;
    animation:slideDown 0.3s ease;
  }

  @keyframes slideDown{
    from{
      opacity:0;
      transform:translateY(-10px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  /* KPI Grid */
  .kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
  }

  .kpi{
    background:var(--bg-card);
    border-radius:12px;
    padding:16px;
    box-shadow:var(--shadow-sm);
    border-left:4px solid var(--biru);
    transition:all 0.3s ease;
    position:relative;
    overflow:hidden;
  }

  .kpi::before{
    content:'';
    position:absolute;
    top:0;
    right:0;
    width:60px;
    height:60px;
    background:radial-gradient(circle,rgba(102,126,234,0.1) 0%,rgba(102,126,234,0) 70%);
    border-radius:50%;
    pointer-events:none;
  }

  .kpi:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-md);
  }

  .kpi:nth-child(2){
    border-left-color:var(--hijau);
  }

  .kpi:nth-child(3){
    border-left-color:var(--merah);
  }

  .kpi:nth-child(4){
    border-left-color:var(--kuning);
  }

  .kpi h3{
    font-size:11px;
    color:#888;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:8px;
  }

  .kpi p{
    font-size:28px;
    font-weight:800;
    background:linear-gradient(135deg,var(--biru),var(--ungu));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .kpi:nth-child(2) p{
    background:linear-gradient(135deg,var(--hijau),#229954);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .kpi:nth-child(3) p{
    background:linear-gradient(135deg,var(--merah),#c0392b);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .kpi:nth-child(4) p{
    background:linear-gradient(135deg,var(--kuning),#e67e22);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* Cards */
  .card{
    background:var(--bg-card);
    border-radius:12px;
    padding:16px;
    box-shadow:var(--shadow-sm);
    border:1px solid rgba(102,126,234,0.05);
    transition:all 0.3s ease;
  }

  .card:hover{
    box-shadow:var(--shadow-md);
  }

  .card h3{
    font-size:14px;
    margin-bottom:12px;
    color:#222;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .card h3::before{
    content:'';
    width:3px;
    height:18px;
    background:linear-gradient(180deg,var(--biru),var(--ungu));
    border-radius:2px;
  }

  /* Charts */
  .charts{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:16px;
  }

  canvas{
    max-height:300px;
  }

  /* Tables */
  .table-wrapper{
    overflow-x:auto;
    border-radius:8px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }

  th,td{
    padding:10px 12px;
    text-align:left;
    border-bottom:1px solid #ecf0f1;
  }

  th{
    background:linear-gradient(180deg,#f8f9fa 0%,#f1f3f5 100%);
    color:#222;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    border-bottom:2px solid #e0e0e0;
  }

  tr:hover{
    background:rgba(102,126,234,0.04);
  }

  td strong{
    color:var(--biru);
    font-weight:700;
  }

  .empty-msg{
    text-align:center;
    padding:24px 12px;
    color:#999;
    font-style:italic;
  }

  /* Responsive */
  @media (max-width:768px){
    main{
      padding:12px;
      gap:12px;
    }

    header{
      flex-direction:column;
      align-items:flex-start;
    }

    header h1{
      width:100%;
    }

    .header-controls{
      width:100%;
    }

    header input,header button{
      flex:1;
      min-width:0;
    }

    .kpis{
      grid-template-columns:repeat(2,1fr);
    }

    .charts{
      grid-template-columns:1fr;
    }

    .kpi p{
      font-size:24px;
    }

    table{
      font-size:11px;
    }

    th,td{
      padding:8px 6px;
    }
  }

  @media (max-width:480px){
    header h1{
      font-size:16px;
    }

    .kpis{
      grid-template-columns:1fr;
    }

    .kpi p{
      font-size:20px;
    }

    .card h3{
      font-size:12px;
    }
  }

  /* Loading state */
  .loading{
    opacity:0.6;
    pointer-events:none;
  }

  /* Scrollbar */
  ::-webkit-scrollbar{
    width:8px;
    height:8px;
  }

  ::-webkit-scrollbar-track{
    background:#f1f1f1;
  }

  ::-webkit-scrollbar-thumb{
    background:#ccc;
    border-radius:4px;
  }

  ::-webkit-scrollbar-thumb:hover{
    background:#999;
  }
</style>
</head>
<body>
<header>
  <h1>📊 Dashboard Kehadiran Murid</h1>
  <div class="header-controls">
    <input type="date" id="tarikh">
    <button id="btnRefresh" title="Muat semula data">🔄 Muat Semula</button>
    <button id="btnSet" title="Tetapan API">⚙️ Tetapan</button>
  </div>
</header>
<main>
  <p id="ralat"></p>
  
  <section class="kpis">
    <div class="kpi">
      <h3>📈 % Kehadiran</h3>
      <p id="kpiPeratus">–</p>
    </div>
    <div class="kpi">
      <h3>✅ Hadir / Jumlah</h3>
      <p id="kpiHadir">–</p>
    </div>
    <div class="kpi">
      <h3>❌ Tidak Hadir</h3>
      <p id="kpiTidak">–</p>
    </div>
    <div class="kpi">
      <h3>⏳ Belum Dikemaskini</h3>
      <p id="kpiBelum">–</p>
    </div>
  </section>

  <section class="charts">
    <div class="card">
      <h3>Trend % Kehadiran (30 hari terakhir)</h3>
      <canvas id="chartTrend"></canvas>
    </div>
    <div class="card">
      <h3>Kehadiran Mengikut Tingkatan</h3>
      <canvas id="chartTingkat"></canvas>
    </div>
  </section>

  <section class="charts">
    <div class="card">
      <h3>10 Kelas Kehadiran Terendah</h3>
      <div id="tblKelas"></div>
    </div>
    <div class="card">
      <h3>Murid Tidak Hadir Hari Ini</h3>
      <div id="tblSebab"></div>
    </div>
  </section>
</main>

<script src="app.js?v=2"></script>
</body>
</html>
